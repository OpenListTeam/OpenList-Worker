name: Seed tests

# Focused regression pipeline for the worker transfer seed implementation:
# TypeScript type check plus the seed route/codec unit tests.
on:
  pull_request:
    paths:
      - "src/backend/internal/seed/**"
      - "src/backend/server/seed.ts"
      - "src/backend/server/seed.test.ts"
      - "src/backend/server/fs.ts"
      - "src/backend/internal/model/db.ts"
      - "src/backend/internal/op/storage.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/seed-tests.yml"
  push:
    branches:
      - main
      - feat/advanced-transfer-seeds-v2
    paths:
      - "src/backend/internal/seed/**"
      - "src/backend/server/seed.ts"
      - "src/backend/server/seed.test.ts"
      - "src/backend/server/fs.ts"
      - "src/backend/internal/model/db.ts"
      - "src/backend/internal/op/storage.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/seed-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed-tests:
    name: Worker seed tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run lint

      - name: Seed unit tests
        run: pnpm exec tsx --test src/backend/server/seed.test.ts
