<!doctype html>
<html lang="en" translate="no">
  <head>
    <!-- customize head -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="same-origin" />
    <meta name="generator" content="OpenListNext" />
    <meta name="theme-color" content="#000000" />
    <meta name="google" content="notranslate" />
    <link href="/manifest.json" rel="manifest" crossorigin="use-credentials" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OpenListNext" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <title>Loading...</title>
    <script>
      window.OPENLISTNEXT_CONFIG = {
        cdn: undefined,
        base_path: undefined,
        api: undefined,
        main_color: undefined,
      }
    </script>
    <script>
      // 自愈：部署新版本后，旧缓存用户可能加载旧入口 JS，动态 import 新哈希
      // 的 chunk 时失败（Failed to fetch dynamically imported module）。
      // 捕获后自动带参数刷新，强制浏览器拉取最新 HTML 与资源。
      ;(function () {
        var KEY = "openlistnext_reload_on_module_error"
        var MAX = 2
        function shouldReload() {
          var n = parseInt(sessionStorage.getItem(KEY) || "0", 10)
          return n < MAX
        }
        function reload() {
          var n = parseInt(sessionStorage.getItem(KEY) || "0", 10) + 1
          sessionStorage.setItem(KEY, String(n))
          var url = window.location.href
          var sep = url.indexOf("?") >= 0 ? "&" : "?"
          window.location.replace(url + sep + "v=" + Date.now())
        }
        function isModuleError(e) {
          var msg = ""
          if (e && e.message) msg = String(e.message)
          else if (e && e.reason && e.reason.message) msg = String(e.reason.message)
          return /Failed to fetch dynamically imported module/.test(msg)
        }
        window.addEventListener("error", function (e) {
          if (isModuleError(e) && shouldReload()) reload()
        })
        window.addEventListener("unhandledrejection", function (e) {
          if (isModuleError(e) && shouldReload()) reload()
        })
      })()
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script src="/src/main.tsx" type="module"></script>
    <!-- customize body -->
  </body>
</html>
