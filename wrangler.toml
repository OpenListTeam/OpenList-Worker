name = "openlistnextpro"
main = "src/backend/worker.ts"
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"


[vars]
ENVIRONMENT = "production"
ADMIN_USERNAME = "admin"
ADMIN_PASSWORD = "admin"
VITE_API_URL = "/api"

# KV namespace 绑定由 scripts/deploy.js 自动检测/创建并写入（无需手动配置）。
# 直接运行 `npm run deploy` 即可自动完成绑定；若直接 `wrangler deploy`，
# 站点将以内存模式运行（配置不持久化）。

