name = "openlist-tsworkers"
main = "src/backend/worker.ts"
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"

[vars]
ENVIRONMENT = "production"

# ============================================================
# 数据存储格式
# ============================================================
# map（默认）- 整对象序列化为单个 JSON 键值，适合 KV/Blob
# key        - 分 key 存储，每实体一条记录（如 users_1）
# sql        - 关系表格式，与 Go 后端一致（适用于 D1/MySQL）
DB_FORMAT = "map"

# ============================================================
# 数据库驱动
# ============================================================
# auto（默认）- 自动检测：blob → cfkv → kv → d1 → memory
# blob        - 腾讯云 EdgeOne Blob / 阿里云 ESA Blob
# cfkv        - Cloudflare KV API（需 CF_ACCOUNT/CF_KV_UUID/CF_API_KEY）
# kv          - Cloudflare KV binding（需下方 [[kv_namespaces]]）
# d1          - Cloudflare D1（需下方 [[d1_databases]]）
# do          - Cloudflare Durable Objects（需下方 [[durable_objects]]）
# mysql       - 外部 MySQL（仅 Node 容器，需 MYSQL_URL 或分项）
DB_DRIVER = "auto"

# ============================================================
# 安全鉴权
# ============================================================
# 请以 Secret 类型配置
# JWT 签名密钥（>=16字符，兼作字段加密与定时任务鉴权）
# JWT_SECRET = ""
# 跳过安装向导，自动以该密码初始化admin
# ADMIN_PASS = ""
# CORS白名单（逗号分隔，不设则仅同源）
# ALLOW_URLS = "https://yourdomain.com"

# ============================================================
# 可选参数
# ============================================================
# 单次整体上传上限（字节），默认26214400
# MAX_UPLOAD = "26214400"
# 分片单片上传上限（字节），默认16777216
# MAX_UPPART = "16777216"
# 前端静态资源CDN地址，支持$version占位符
# ASSET_URLS = "https://example.com/dist"
# 种子数据来源主机白名单（逗号/空格分隔）
# ALLOW_SEED = ""

# ============================================================
# KV/Blob存储
# ============================================================
# KV binding名固定为KV
# Cloudflare KV API三项需全部填写
# CF_ACCOUNT = ""
# CF_KV_UUID = ""
# CF_API_KEY = ""

# ============================================================
# MySQL
# ============================================================
# 方式一：连接串
# MYSQL_URL = "mysql://user:pass@host:3306/db"
# 方式二：分项配置
# MYSQL_HOST = "127.0.0.1"
# MYSQL_PORT = "3306"
# MYSQL_USER = "root"
# MYSQL_PASS = ""
# MYSQL_NAME = "openlist"

# ============================================================
# KV
# ============================================================
# [[kv_namespaces]]
# binding = "KV"
# id = ""

# ============================================================
# D1
# ============================================================
# 省略database_id时，wrangler(>=4.45.0)自动创建同名库并回写
# 旧版本wrangler请填写自己的database_id
# [[d1_databases]]
# binding = "DB"
# database_name = "openlist"
# database_id = ""

# ============================================================
# Durable Objects
# ============================================================
# DO内置SQLite存储（强一致性+事务），适合单租户部署
# 启用时取消注释，并把DB_DRIVER设为do
# [[durable_objects.bindings]]
# name = "DO"
# class_name = "OpenListDB"

# [[migrations]]
# tag = "v1"
# new_sqlite_classes = ["OpenListDB"]
