name = "openlist-tsworkers"
main = "src/backend/worker.ts"
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"


[vars]
ENVIRONMENT = "production"

# ===================== 数据库后端（DB_DRIVER）=====================
# json  - 默认后端，整对象存单个 key，内部自动检测 KV/Blob/CF REST/内存
# kv    - KV 分表后端，每实体一条 key（openlist_tbl:<table>:<主键>），
#         避免大 JSON 读写与单 key 过大（需下方 KV binding 或 EdgeOne Blob）
# d1    - Cloudflare D1（需下方 [[d1_databases]] 绑定）
# mysql - 外部 MySQL（仅 Node 容器运行时，需 MYSQL_URL 或 MYSQL_* 分项）
DB_DRIVER = "json"

# ===================== json 后端存储方案（DB_JSON_BACKEND）=====================
# 仅 DB_DRIVER = "json" 时生效；取值（大小写不敏感）：
#   auto（默认，不设即此值）/ blob / kv / cf_rest
# 示例：改用 json 后端并强制走 KV binding：
#   DB_DRIVER = "json"
#   DB_JSON_BACKEND = "kv"
# DB_JSON_BACKEND = "auto"

# ===================== KV / Blob 存储 =====================
# 自定义 KV binding 名（json/kv 模式；不设则自动探测 KV/EDGEONE_KV/EO_KV 等）
# KV_NAME = "KV"
# Cloudflare KV REST API（cf_rest 模式需以下三项，全部填写）
# CF_ACCOUNT_ID = ""
# CF_KV_NAMESPACE_ID = ""
# CF_API_TOKEN = ""

# ===================== MySQL（DB_DRIVER = "mysql" 时，二选一）=====================
# 方式一：连接串（也可用 DATABASE_URL）
# MYSQL_URL = "mysql://user:pass@host:3306/db"
# 方式二：分项配置
# MYSQL_HOST = "127.0.0.1"
# MYSQL_PORT = "3306"
# MYSQL_USER = "root"
# MYSQL_PASSWORD = ""
# MYSQL_DATABASE = "openlist"

# ===================== 安全 / 鉴权 =====================
# JWT 签名密钥（推荐 >=16 字符；未配置时自动生成并持久化到 KV）
JWT_SECRET = ""
# 静态加密密钥（优先于 JWT_SECRET；未配置时网盘 token 等敏感字段将明文落盘）
ENCRYPTION_SECRET = ""
# 跳过安装向导、自动以该密码初始化 admin（可选兼容项）
# ADMIN_PASSWORD = ""
# 定时刷新任务鉴权密钥（仅 EdgeOne Schedules 需要）
# CRON_SECRET = ""
# CORS 允许来源白名单（逗号分隔）
# ALLOWED_ORIGINS = "https://yourdomain.com"

# ===================== 其他 =====================
# 内存 JSON 数据库（仅测试/本地调试用，重启即失）
# DATABASE_JSON = ""

[[kv_namespaces]]
binding = "KV"

# ===================== D1 =====================
# 使用 Cloudflare 的 Automatic resource provisioning：
# 省略 database_id，部署时 wrangler（>= 4.45.0）会自动创建同名 D1 库并回写 id。
# 若你的 wrangler 版本较旧，可取消下方注释并填入你自己的 database_id。
# [[d1_databases]]
# binding = "DB"
# database_name = "openlist"
# database_id = ""




