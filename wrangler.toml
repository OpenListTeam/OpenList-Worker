name = "openlist-tsworkers"
main = "src/backend/worker.ts"
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"


[vars]
ENVIRONMENT = "production"

# ===================== 数据存储格式（DB_FORMAT）=====================
# 决定数据在数据库中的存储方式（大小写不敏感）：
#   map（默认）- 整对象序列化为单个 JSON 键值，适合 KV/Blob 等简单存储
#   key       - 分 key 存储，每实体一条记录（openlist_tbl:<table>:<主键>），
#               避免大 JSON 读写与单 key 过大
#   sql       - 关系数据库表格式，与 Go 后端完全一致（适用于 D1 / MySQL）
DB_FORMAT = "map"

# ===================== 数据库驱动（DB_DRIVER）=====================
# 决定底层存储系统（大小写不敏感）：
#   auto（默认）- 自动检测，优先级 blob → cfkv → kv → d1 → memory
#   blob  - 腾讯云 EdgeOne Blob / 阿里云 ESA Blob
#   cfkv  - Cloudflare KV REST API（需 CF_ACCOUNT_ID / CF_KV_NAMESPACE_ID / CF_API_TOKEN）
#   kv    - Cloudflare KV binding（需下方 [[kv_namespaces]] 绑定）
#   d1    - Cloudflare D1（需下方 [[d1_databases]] 绑定）
#   do    - Cloudflare Durable Objects（需下方 [[durable_objects]] 绑定与 migrations）
#   mysql - 外部 MySQL（仅 Node 容器运行时，需 MYSQL_URL 或 MYSQL_* 分项）
DB_DRIVER = "auto"

# ===================== 表名前缀（TABLE_PREFIX，仅 DB_FORMAT = "sql" 时生效）=====================
# SQL 表名 = 前缀 + Go 的复数表名（setting_items/sharing_dbs/storages/users/metas）。
# 前缀对齐 Go 后端的 TABLE_PREFIX，默认 "x_"，与 Go 共享同一数据库时保持默认即可。
# TABLE_PREFIX = "x_"

# ===================== KV / Blob 存储 =====================
# 自定义 KV binding 名（map/key 模式；不设则自动探测 KV/EDGEONE_KV/EO_KV 等）
# KV_NAME = "KV"
# Cloudflare KV REST API（DB_DRIVER = "cfkv" 时需以下三项，全部填写）
# CF_ACCOUNT_ID = ""
# CF_KV_NAMESPACE_ID = ""
# CF_API_TOKEN = ""

# ===================== MySQL（DB_DRIVER = "mysql" 时，二选一）=====================
# 方式一：连接串（也可用 DATABASE_URL）
# MYSQL_URL = "mysql://user:pass@host:3306/db"
# 方式二：分项配置
# MYSQL_HOST = "127.0.0.1"
# MYSQL_PORT = "3306"
# MYSQL_USER = "root"
# MYSQL_PASSWORD = ""
# MYSQL_DATABASE = "openlist"

# ===================== 安全 / 鉴权 =====================
# 请在 Cloudflare Worker 的 Runtime Variables and Secrets 中以 Secret 类型配置
# JWT 签名密钥（推荐 >=16 字符；未配置时自动生成并持久化到 KV）
# JWT_SECRET = ""
# 静态加密密钥（优先于 JWT_SECRET；未配置时网盘 token 等敏感字段将明文落盘）
# ENCRYPTION_SECRET = ""
# 跳过安装向导、自动以该密码初始化 admin（可选兼容项）
# ADMIN_PASSWORD = ""
# 定时刷新任务鉴权密钥（仅 EdgeOne Schedules 需要）
# CRON_SECRET = ""
# CORS 允许来源白名单（逗号分隔）
# ALLOWED_ORIGINS = "https://yourdomain.com"

# ===================== 其他 =====================
# 内存 JSON 数据库（仅测试/本地调试用，重启即失）
# DATABASE_JSON = ""

# [[kv_namespaces]]
# binding = "KV"

# ===================== D1 =====================
# 使用 Cloudflare 的 Automatic resource provisioning：
# 省略 database_id，部署时 wrangler（>= 4.45.0）会自动创建同名 D1 库并回写 id。
# 若你的 wrangler 版本较旧，可取消下方注释并填入你自己的 database_id。
# [[d1_databases]]
# binding = "DB"
# database_name = "openlist"
# database_id = ""

# ===================== Durable Objects（DB_DRIVER = "do" 时启用）=====================
# DO 内置 SQLite 存储（强一致性 + 事务），适合需要一致性的单租户部署。
# 启用方式：取消以下注释，并把 DB_DRIVER 设为 "do"。
# [[durable_objects.bindings]]
# name = "DO"
# class_name = "OpenListDB"
# 
# [[migrations]]
# tag = "v1"
# new_sqlite_classes = ["OpenListDB"]




